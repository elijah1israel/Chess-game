name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          # Fill in android/ (and any other platform folders that are missing)
          # from the existing pubspec.yaml. Safe to run repeatedly.
          flutter create \
            --platforms=android \
            --project-name=ai_chess_arena \
            --org=com.aichess.arena \
            .

      - name: Patch AndroidManifest.xml (INTERNET permission, app label)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import re, sys
          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              xml = f.read()
          if 'android.permission.INTERNET' not in xml:
              perm = '\n    <uses-permission android:name="android.permission.INTERNET"/>'
              xml = re.sub(r'(<manifest\b[^>]*>)', r'\1' + perm, xml, count=1)
          # Force the launcher label to the display name
          xml = re.sub(
              r'android:label="[^"]*"',
              'android:label="Chess Arena"',
              xml,
              count=1,
          )
          with open(path, 'w', encoding='utf-8') as f:
              f.write(xml)
          PY
          echo '--- AndroidManifest.xml (release) ---'
          cat "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build release APK (universal)
        run: flutter build apk --release

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-chess-arena-apk-split
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chess-arena-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
